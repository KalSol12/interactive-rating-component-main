<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Interactive rating component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
 
</head>
<body>
  <div class="container">
    <!-- Rating state start -->
    <div class="rating-state">
      <div class="header">
        <span class="star-icon"><img src="images/icon-star.svg" alt="star-icon" srcset=""></span>
         
      </div>
      <h1>How did we do?</h1>
      <p>Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</p>
      
      <div class="rating-buttons">
        <button class="rating-button" data-rating="1">1</button>
        <button class="rating-button" data-rating="2">2</button>
        <button class="rating-button" data-rating="3">3</button>
        <button class="rating-button" data-rating="4">4</button>
        <button class="rating-button" data-rating="5">5</button>
      </div>
      
      <button class="submit-btn">Submit</button>
    </div>
    <!-- Rating state end -->

    <!-- Thank you state start -->
    <div class="thank-you-state">
      <div class="illustration">
        <img src="images/illustration-thank-you.svg" alt="Rating illustration">
      </div>
      <div class="selected-rating">You selected <span id="rating-value">0</span> out of 5</div>
      <h1>Thank you!</h1>
      <p>We appreciate you taking the time to give a rating.<br>If you ever need more support, don't hesitate to get in touch!</p>
    </div>
    <!-- Thank you state end -->
  </div>

  <!-- <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div> -->

  <script>
    // Get DOM elements
    const ratingState = document.querySelector('.rating-state');
    const thankYouState = document.querySelector('.thank-you-state');
    const ratingButtons = document.querySelectorAll('.rating-button');
    const submitButton = document.querySelector('.submit-btn');
    const ratingValueDisplay = document.getElementById('rating-value');
    
    let selectedRating = 0;

    // Add event listeners to rating buttons
    ratingButtons.forEach(button => {
      button.addEventListener('click', () => {
        // Remove selected class from all buttons
        ratingButtons.forEach(btn => btn.classList.remove('selected'));
        
        // Add selected class to clicked button
        button.classList.add('selected');
        
        // Store the selected rating
        selectedRating = parseInt(button.getAttribute('data-rating'));
      });
    });

    // Add event listener to submit button
    submitButton.addEventListener('click', () => {
      if (selectedRating === 0) {
        alert('Please select a rating before submitting!');
        return;
      }
      
      // Update the displayed rating
      ratingValueDisplay.textContent = selectedRating;
      
      // Switch to thank you state
      ratingState.style.display = 'none';
      thankYouState.style.display = 'block';
    });
  </script>
</body>
</html>
